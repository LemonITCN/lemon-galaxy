[package]
name = "galaxy-ffi"
description = "LemonGalaxy 内核导出给 Swift / Kotlin 的接口（uniffi），C# 由 uniffi-bindgen-cs 生成"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "galaxy_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
galaxy-proto.workspace = true
galaxy-crypto.workspace = true
galaxy-net.workspace = true
galaxy-client.workspace = true
galaxy-host.workspace = true
galaxy-agent.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
vt100 = "0.18"
bytes.workspace = true
uuid.workspace = true
uniffi = { version = "=0.32.0" }

# 桌面端（Windows 主控端）用的 H.264 软解；手机端用系统硬件解码，不编进去
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
openh264 = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
