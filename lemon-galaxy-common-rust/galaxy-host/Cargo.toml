[package]
name = "galaxy-host"
description = "LemonGalaxy 被控端内核：接受连接、端到端认证、权限、终端、文件、命令执行、画面与输入（平台钩子）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
galaxy-proto.workspace = true
galaxy-crypto.workspace = true
galaxy-net.workspace = true
galaxy-client.workspace = true
galaxy-agent.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rand.workspace = true
bytes.workspace = true
hex.workspace = true
quinn.workspace = true
opus.workspace = true
vt100 = "0.15"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "process", "signal", "user", "fs", "ioctl", "hostname"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
base64.workspace = true
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Authentication_Identity",
  "Win32_Globalization",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
# AI 应用操作（win_cu）：UI Automation、窗口截图、窗口消息、AI 光标分层窗口
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
jpeg-encoder = "0.7"

[target.'cfg(all(windows, target_arch = "aarch64", target_env = "gnu"))'.dependencies]
# 只影响本机交叉检查用的 MinGW ARM64（正式包用 MSVC）：libopus 在这里没有 ARM CPU 检测方法，关掉 SIMD
opusic-sys = { version = "0.7", features = ["no-simd"] }

[target.'cfg(all(windows, target_vendor = "win7"))'.dependencies]
# Windows 老系统兼容版（*-win7-windows-msvc）：libopus 判断能不能用 AVX2 只看 CPUID，不看系统支不支持 AVX（XSAVE）。
# XP / Vista / 没打 SP1 的 Win7 不支持，新 CPU 上一编码有声音的数据就是非法指令、整个进程崩掉（XP 虚拟机实测）。
# 关掉运行时检测，只用编译时就确定的 SSE / SSE2（32 位目标是 pentium4）
opusic-sys = { version = "0.7", features = ["no-runtime-feature-detection"] }

[lints.rust]
# Windows XP 兼容版构建时加 --cfg lemon_galaxy_xp（见 scripts/build-windows-legacy.sh）
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lemon_galaxy_xp)'] }
