[package]
name = "galaxy-worker"
description = "LemonGalaxy 被控端命令行的公共部分（Linux / Windows 共用），各系统只实现服务安装、数据目录等差异"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
galaxy-proto.workspace = true
galaxy-crypto.workspace = true
galaxy-net.workspace = true
galaxy-client.workspace = true
galaxy-host.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7"
parking_lot.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

# Windows 本机控制接口（命名管道）：管道的访问控制、按令牌认人、会话状态、可选的系统用户
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

# polkit（本机控制接口鉴权）：纯 Rust 的 D-Bus，不链接 libdbus
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints.rust]
# Windows XP 兼容版构建时加 --cfg lemon_galaxy_xp（见 scripts/build-windows-legacy.sh）
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lemon_galaxy_xp)'] }
