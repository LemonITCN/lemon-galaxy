[package]
name = "galaxy-client"
description = "LemonGalaxy 客户端内核：服务器接口、登录与账号密钥、信令、发起连接、会话功能、加密库"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
galaxy-proto.workspace = true
galaxy-crypto.workspace = true
galaxy-net.workspace = true
galaxy-agent.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rand.workspace = true
bytes.workspace = true
uuid.workspace = true
quinn.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio-tungstenite.workspace = true
# SSH 直连：用 ring 做加密后端（与 rustls 一致，免去 aws-lc 的交叉编译依赖）
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
vt100 = "0.18"
hex.workspace = true
sha2.workspace = true
base64.workspace = true
opus.workspace = true
# 会话录像：分片 MP4 封装（纯 Rust）
muxide = { version = "0.5", default-features = false }

# 本机声卡播放：Linux 不是主控端平台（安卓构建会在 Linux 主机上编一份内核生成绑定，不能依赖 ALSA 开发库）
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = { version = "0.18", optional = true }

[dev-dependencies]
openh264 = "0.9"
mp4 = "0.14"

[features]
# 本机声卡播放远端声音（客户端用；Linux 命令行工具不需要）
playback = ["dep:cpal"]

[target.'cfg(all(windows, target_arch = "aarch64", target_env = "gnu"))'.dependencies]
# 只影响本机交叉检查用的 MinGW ARM64（正式包用 MSVC）：libopus 在这里没有 ARM CPU 检测方法，关掉 SIMD
opusic-sys = { version = "0.7", features = ["no-simd"] }
