# 每次推送到 main、每个 PR 都构建全部工程并测试。
# 发布：推送到 main 且全部通过后，自动发布 Release「LemonGalaxy <版本>.<构建序号>」并标为最新版；推送 v* 标签时按标签版本发布。
#
# 产物
#   服务器         lemon-galaxy-server  Linux x86_64 / ARM64 静态单文件、Windows 10 / Server 2016 起 x64 / ARM64、
#                  macOS 13 起 Apple 芯片 + Intel 通用单文件（内嵌 Web 管理后台，可装成系统服务；终端里不带参数运行进交互菜单）
#   Linux 被控端   lemon-galaxy-worker  Linux x86_64 / ARM64：glibc 2.17 起单文件（含远程桌面、显卡编码）、musl 静态精简版（只有终端与文件）、
#                  .deb / .rpm（内核 + GTK 界面 + 系统服务，界面在 Debian 10 容器里编，Ubuntu 20.04 / Debian 10 / RHEL 8 起可用）
#   Windows 被控端 lemon-galaxy-worker.exe  Windows 10 / Server 2016 起，x64 / ARM64 单文件（系统服务 + 画面代理）；
#                  老系统兼容版（scripts/build-windows-legacy.sh）：Windows 7 SP1 / 8 x64、Vista SP2 / 7 / 8 32 位、XP SP3 32 位（实验）
#   Mac 客户端     LemonGalaxy.dmg      macOS 13 起，Apple 芯片 + Intel 通用（主控 + 被控）
#   安卓客户端     LemonGalaxy.apk      Android 8.0 起
#
# 可选的签名（仓库 Settings → Secrets 配置后自动启用，不配置则跳过）
#   MACOS_CERTIFICATE_P12 / MACOS_CERTIFICATE_PASSWORD / MACOS_SIGN_IDENTITY   Developer ID 证书
#   APPLE_NOTARY_KEY_P8 / APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER_ID         公证
#   LEMONGALAXY_KEYSTORE_BASE64 / LEMONGALAXY_KEYSTORE_PASSWORD / LEMONGALAXY_KEY_ALIAS / LEMONGALAXY_KEY_PASSWORD   安卓正式签名
#   LEMONGALAXY_RELEASE_SIGNING_KEY   发布签名私钥（Ed25519 种子 base64）。有它才给 SHA256SUMS 签名；客户端只装签过名的更新
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  # 编进程序的完整版本号：标签发布用标签，否则「Cargo 版本.构建序号」（见 galaxy-proto/build.rs），自动更新靠它比较新旧
  LEMONGALAXY_BUILD_NUMBER: ${{ github.run_number }}
  LEMONGALAXY_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  rust-tests:
    name: 内核测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 更新 Rust
        run: rustup update stable --no-self-update && rustup default stable && rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux 图形界面的编译依赖（GTK 3）
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev >/dev/null
      - name: 单元测试
        run: cargo test --workspace --exclude galaxy-ffi

  web:
    name: 管理后台前端
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 构建
        working-directory: lemon-galaxy-server/web
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: lemon-galaxy-server/web/dist
          if-no-files-found: error

  linux:
    name: 服务器与 Linux 被控端 (${{ matrix.arch }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: lemon-galaxy-server/web/dist
      - name: 准备工具链（musl 静态、zig 编 glibc 2.17）与桌面测试环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools rpm xvfb xauth xdotool dbus-x11 xfce4-session xfwm4 xfdesktop4 xfce4-panel xfce4-settings mutter pipewire wireplumber >/dev/null
          rustup update stable --no-self-update && rustup default stable
          rustup target add ${{ matrix.arch }}-unknown-linux-musl ${{ matrix.arch }}-unknown-linux-gnu
          pip install --quiet --break-system-packages ziglang cargo-zigbuild
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-linux-${{ matrix.arch }}-
      - name: 编译
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          A=${{ matrix.arch }}
          mkdir -p dist
          # 服务器、开发用主控端、被控端精简版：musl 静态单文件
          cargo build --release --target $A-unknown-linux-musl -p lemon-galaxy-server -p galaxy-dev
          cargo build --release --target $A-unknown-linux-musl -p lemon-galaxy-worker-linux --no-default-features
          cp target/$A-unknown-linux-musl/release/lemon-galaxy-server dist/
          cp target/$A-unknown-linux-musl/release/galaxy-dev dist/
          cp target/$A-unknown-linux-musl/release/lemon-galaxy-worker dist/lemon-galaxy-worker-musl
          # 被控端（含远程桌面）：只依赖 glibc 2.17，显卡编码、PipeWire、PulseAudio 运行时加载
          cargo zigbuild --release --target $A-unknown-linux-gnu.2.17 -p lemon-galaxy-worker-linux
          cp target/$A-unknown-linux-gnu/release/lemon-galaxy-worker dist/
          file dist/* || true
          echo "被控端依赖的系统库："; objdump -p dist/lemon-galaxy-worker | grep NEEDED
          MAXG="$(objdump -T dist/lemon-galaxy-worker | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "最高 glibc 符号版本：$MAXG"
          [ "$(printf '%s\nGLIBC_2.17\n' "$MAXG" | sort -V | tail -1)" = GLIBC_2.17 ] || { echo "用到了 glibc 2.17 之后的符号" >&2; exit 1; }
          if objdump -p dist/lemon-galaxy-worker | grep NEEDED | grep -v -E 'lib(c|m|dl|pthread|rt|gcc_s|util)\.so|ld-linux'; then echo "链接了不该链接的系统库" >&2; exit 1; fi
          dist/lemon-galaxy-worker-musl version
          ls -l dist
      - name: 端到端测试（服务器 + Linux 被控端 + 主控）
        run: scripts/e2e.sh dist
      - name: 服务器装成 systemd 服务（安装、改参数、卸载）
        run: scripts/server-service-test.sh dist
      - name: 远程桌面端到端（没人登录 → 虚拟桌面 → 画面、截图、剪贴板、键鼠）
        run: |
          id alice >/dev/null 2>&1 || sudo useradd -m -s /bin/bash alice
          sudo scripts/e2e-desktop.sh dist
      - name: GNOME Wayland 后端（无头 mutter + PipeWire）
        run: sudo LG_TEST_USER=alice scripts/test-mutter-headless.sh "$PWD/dist/lemon-galaxy-worker"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/lemon-galaxy-server
            dist/lemon-galaxy-worker
            dist/lemon-galaxy-worker-musl
            dist/galaxy-dev
          if-no-files-found: error

  linux-gui:
    name: Linux 被控端界面与安装包 (${{ matrix.arch }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 在 Debian 10 容器里编界面（glibc 2.28、GTK 3.24：Ubuntu 20.04 / Debian 10 / RHEL 8 起都能用）
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e LEMONGALAXY_BUILD_NUMBER -e LEMONGALAXY_BUILD_VERSION debian:10 bash -c '
            set -e
            # Debian 10 已归档：镜像里的基础包来自安全更新，要把安全更新的归档源也加上，否则开发包的依赖对不上
            printf "deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl build-essential pkg-config libgtk-3-dev >/dev/null
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null
            . $HOME/.cargo/env
            CARGO_TARGET_DIR=/src/target-gui cargo build --release -p lemon-galaxy-worker-gui
            mkdir -p dist && cp target-gui/release/lemon-galaxy-worker-gui dist/
            chown -R '"$(id -u):$(id -g)"' dist target-gui
          '
          objdump -T dist/lemon-galaxy-worker-gui | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: core
      - name: 打 .deb / .rpm
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="$VERSION.$GITHUB_RUN_NUMBER"; fi
          chmod +x core/lemon-galaxy-worker dist/lemon-galaxy-worker-gui
          scripts/package-linux.sh ${{ matrix.arch }} "$V" core/lemon-galaxy-worker dist/lemon-galaxy-worker-gui pkg
          dpkg-deb --info pkg/*.deb | head -20
          dpkg-deb --contents pkg/*.deb
          rpm -qlp pkg/*.rpm
      - name: 安装包实测（装、服务起来、界面程序能启动、卸载）
        run: |
          sudo apt-get install -y -qq ./pkg/*.deb >/dev/null
          sleep 3
          systemctl is-active lemon-galaxy-worker
          ls -la /run/lemon-galaxy-worker/
          xvfb-run -a timeout 5 lemon-galaxy-worker-gui --version || true
          sudo apt-get remove -y -qq lemon-galaxy-worker >/dev/null
          ! systemctl is-active lemon-galaxy-worker
      - uses: actions/upload-artifact@v7
        with:
          name: linux-pkg-${{ matrix.arch }}
          path: pkg/*
          if-no-files-found: error

  windows:
    name: Windows 被控端 (${{ matrix.arch }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, arch: x86_64 }
          - { os: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # 静态链接 C 运行库，目标机器不用装 VC++ 运行库
      RUSTFLAGS: -C target-feature=+crt-static
      TARGET: ${{ matrix.arch }}-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: lemon-galaxy-server/web/dist
      - name: 准备 Rust
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add "$TARGET"
          rustc -vV
          which clang || echo "没有 clang"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-windows-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-windows-${{ matrix.arch }}-
      - name: 编译
        run: |
          cargo build --release --target "$TARGET" -p lemon-galaxy-worker-windows -p lemon-galaxy-server -p galaxy-dev
          mkdir -p dist
          for b in lemon-galaxy-worker lemon-galaxy-server galaxy-dev; do cp "target/$TARGET/release/$b.exe" dist/; done
          ls -l dist
      - name: 单元测试（Windows 部分）
        run: cargo test --release --target "$TARGET" -p galaxy-host -p galaxy-worker
      - name: 截屏与编码自检
        continue-on-error: true
        run: dist/lemon-galaxy-worker.exe selftest-capture
      - name: 端到端测试（服务器 + Windows 被控端 + 主控，含系统服务）
        run: scripts/e2e.sh dist
      - name: 服务器装成 Windows 服务（安装、防火墙规则、改参数、卸载）
        run: scripts/server-service-test.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          # galaxy-dev 不进发布，给老系统兼容版跑端到端测试用
          path: |
            dist/lemon-galaxy-worker.exe
            dist/lemon-galaxy-server.exe
            dist/galaxy-dev.exe
          if-no-files-found: error

  windows-control:
    name: Windows 主控端
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: 准备 Rust 与 .NET
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add "$TARGET"
          dotnet --list-sdks
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            target
            tools/uniffi-bindgen-cs/target
          key: rust-windows-control-${{ hashFiles('Cargo.lock', 'tools/uniffi-bindgen-cs/Cargo.lock') }}
          restore-keys: rust-windows-control-
      - name: 构建、打包与界面自测
        run: |
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -n "$LEMONGALAXY_BUILD_VERSION" ]; then V="${LEMONGALAXY_BUILD_VERSION#v}"; else V="$BASE.$GITHUB_RUN_NUMBER"; fi
          LEMONGALAXY_VERSION="$V" LEMONGALAXY_BUILD="$GITHUB_RUN_NUMBER" lemon-galaxy-control-windows/scripts/build.sh --selftest
          mkdir -p out && cp lemon-galaxy-control-windows/dist/*.zip out/LemonGalaxy-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-control-selftest
          path: lemon-galaxy-control-windows/selftest
      - uses: actions/upload-artifact@v7
        with:
          name: windows-control
          path: out/LemonGalaxy-Windows-x64.zip
          if-no-files-found: error

  windows7:
    name: Windows 老系统兼容版被控端 (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: win7-x64, artifact: windows7-x86_64 }
          - { flavor: win7-x86, artifact: windows7-x86 }
          - { flavor: xp, artifact: windowsxp-x86 }
    runs-on: windows-2025
    # 用 nightly 的 win7 目标（Rust 标准目标要求 Windows 10）自己编标准库，32 位再链 YY-Thunks / VC-LTL5，先不挡发布
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      LEGACY_NIGHTLY: nightly-2026-11-20
    steps:
      - uses: actions/checkout@v7
      - name: 准备 nightly
        run: |
          rustup toolchain install "$LEGACY_NIGHTLY" --profile minimal --component rust-src
          rustc "+$LEGACY_NIGHTLY" -vV
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/legacy-${{ matrix.flavor }}
            target/legacy-tools
          key: rust-legacy-${{ matrix.flavor }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-legacy-${{ matrix.flavor }}-
      - name: 编译并核对导入表（每个导入的函数目标系统都要有）
        run: scripts/build-windows-legacy.sh ${{ matrix.flavor }}
      - name: 冒烟测试（在新系统上跑一下）
        run: |
          dist/lemon-galaxy-worker.exe version
          dist/lemon-galaxy-worker.exe selftest-capture || true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/lemon-galaxy-worker.exe
            dist/galaxy_ffi.dll
            dist/imports.txt
          if-no-files-found: warn

  windows-legacy-test:
    name: 老系统兼容版端到端测试 (${{ matrix.artifact }})
    needs: [windows, windows7]
    # 在 Windows Server 2025 上跑：验证功能链路（老系统缺的接口由 YY-Thunks 转给真接口），不代表老系统实机；不挡发布
    if: always()
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        artifact: [windows7-x86_64, windows7-x86, windowsxp-x86]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: legacy
      - name: 换上兼容版被控端
        run: |
          cp legacy/lemon-galaxy-worker.exe dist/lemon-galaxy-worker.exe
          dist/lemon-galaxy-worker.exe version
          dist/lemon-galaxy-worker.exe selftest-capture || true
      - name: 端到端测试（服务器 + 兼容版被控端 + 主控，含系统服务）
        run: scripts/e2e.sh dist

  windows-display-driver:
    name: Windows 虚拟屏驱动（未签名包）
    runs-on: windows-2025
    # 先不挡发布、不进 Release：runner 上的 WDK 组件与 NuGet 版本还在摸索（docs/research/virtual-display.md 5.8）
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
        working-directory: lemon-galaxy-worker-windows/driver
    steps:
      - uses: actions/checkout@v7
      - name: 准备 WDK（VS 组件 + NuGet 包）
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          "Visual Studio: $vs"
          $toolset = Get-ChildItem "$vs\MSBuild\Microsoft\VC" -Recurse -Directory -Filter WindowsUserModeDriver10.0 -ErrorAction SilentlyContinue | Select-Object -First 1
          $spectre = Get-ChildItem "$vs\VC\Tools\MSVC\*\lib\spectre\x64" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          $add = @()
          if (-not $toolset) { $add += '--add', 'Component.Microsoft.Windows.DriverKit' }
          if (-not $spectre) { $add += '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre' }
          if ($add) {
            "安装 VS 组件：$add"
            $p = Start-Process "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList (@('modify', '--installPath', "`"$vs`"") + $add + @('--quiet', '--norestart', '--nocache')) -Wait -PassThru
            "vs_installer 退出码 $($p.ExitCode)"
          }
          # WDK 与 SDK 的 NuGet 包取同一版本（以 WDK 最新稳定版为准），生成 Directory.Build.props/targets 导入它们
          nuget install Microsoft.Windows.WDK.x64 -OutputDirectory packages -NonInteractive | Out-Host
          $wdk = Get-ChildItem packages -Directory -Filter 'Microsoft.Windows.WDK.x64.*' | Select-Object -First 1
          $ver = $wdk.Name.Substring('Microsoft.Windows.WDK.x64.'.Length)
          "WDK 版本 $ver"
          foreach ($id in 'Microsoft.Windows.SDK.CPP', 'Microsoft.Windows.SDK.CPP.x64') { nuget install $id -Version $ver -OutputDirectory packages -NonInteractive | Out-Host }
          $order = "Microsoft.Windows.SDK.CPP.$ver", "Microsoft.Windows.SDK.CPP.x64.$ver", "Microsoft.Windows.WDK.x64.$ver"
          foreach ($kind in 'props', 'targets') {
            $imports = foreach ($pkg in $order) {
              Get-ChildItem "packages\$pkg\build" -Recurse -Filter "*.$kind" -ErrorAction SilentlyContinue | ForEach-Object { "  <Import Project=`"$($_.FullName)`" />" }
            }
            "<Project>`n$($imports -join "`n")`n</Project>" | Set-Content -Encoding utf8 "Directory.Build.$kind"
            Get-Content "Directory.Build.$kind"
          }
      - name: 编译驱动与测试工具（x64 Release，不签名）
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" LemonGalaxyDriver.sln /nologo /v:minimal /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem build\x64\Release -Recurse | Format-Table FullName, Length -AutoSize | Out-String -Width 300
      - uses: actions/upload-artifact@v7
        with:
          name: windows-display-driver-x64-unsigned
          path: |
            lemon-galaxy-worker-windows/driver/build/x64/Release/LemonGalaxyDisplay/
            lemon-galaxy-worker-windows/driver/build/x64/Release/LemonGalaxyDisplayTest.exe
          if-no-files-found: error

  macos:
    name: Mac 客户端与 Mac 服务器
    needs: web
    runs-on: macos-26
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: lemon-galaxy-server/web/dist
      - name: 选用最新的正式版 Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i -E 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: 更新 Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-macos-
      - name: 导入签名证书
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "LEMONGALAXY_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: 内核 xcframework
        run: scripts/build-ffi-apple.sh
      - name: 构建通用包与 DMG
        run: |
          [ -n "${LEMONGALAXY_SIGN_IDENTITY:-}" ] || echo "LEMONGALAXY_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -n "$LEMONGALAXY_BUILD_VERSION" ]; then V="${LEMONGALAXY_BUILD_VERSION#v}"; else V="$BASE.$GITHUB_RUN_NUMBER"; fi
          LEMONGALAXY_VERSION="$V" LEMONGALAXY_BUILD="$GITHUB_RUN_NUMBER" LEMONGALAXY_SIGN_IDENTITY="${LEMONGALAXY_SIGN_IDENTITY:--}" lemon-galaxy-control-macos/scripts/build.sh --dmg
          # 纯被控端（菜单栏常驻，可登录多个账号）
          LEMONGALAXY_VERSION="$V" LEMONGALAXY_BUILD="$GITHUB_RUN_NUMBER" LEMONGALAXY_SIGN_IDENTITY="${LEMONGALAXY_SIGN_IDENTITY:--}" lemon-galaxy-worker-macos/scripts/build.sh --dmg
      - name: 公证
        if: env.APPLE_NOTARY_KEY_P8 != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          echo "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for DMG in lemon-galaxy-control-macos/build/dist.noindex/*.dmg lemon-galaxy-worker-macos/build/dist.noindex/*.dmg; do
            xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
            xcrun stapler staple "$DMG"
          done
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: 自测
        run: |
          APP="lemon-galaxy-control-macos/build/LemonGalaxy.noindex/LemonGalaxy.app"
          lipo -info "$APP/Contents/MacOS/LemonGalaxy"
          mkdir -p selftest
          "$APP/Contents/MacOS/LemonGalaxy" --selftest "$PWD/selftest" --only login &
          PID=$!
          for i in $(seq 1 180); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          if kill -0 $PID 2>/dev/null; then kill $PID; echo "自测超时"; exit 1; fi
          wait $PID
          ls selftest | head
          W="lemon-galaxy-worker-macos/build/LemonGalaxyWorker.noindex/LemonGalaxyWorker.app"
          lipo -info "$W/Contents/MacOS/LemonGalaxyWorker"
          mkdir -p selftest-worker
          "$W/Contents/MacOS/LemonGalaxyWorker" --selftest "$PWD/selftest-worker" --only first-run &
          PID=$!
          for i in $(seq 1 180); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          if kill -0 $PID 2>/dev/null; then kill $PID; echo "被控端自测超时"; exit 1; fi
          wait $PID
          ls selftest-worker | head
          mkdir -p out && cp lemon-galaxy-control-macos/build/dist.noindex/*.dmg out/LemonGalaxy-macOS.dmg
          cp lemon-galaxy-worker-macos/build/dist.noindex/*.dmg out/LemonGalaxyWorker-macOS.dmg
      - name: 服务器（Apple 芯片 + Intel 通用单文件）
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          for a in aarch64 x86_64; do cargo build --release --target "$a-apple-darwin" -p lemon-galaxy-server; done
          mkdir -p out-server
          lipo -create -output out-server/lemon-galaxy-server target/aarch64-apple-darwin/release/lemon-galaxy-server target/x86_64-apple-darwin/release/lemon-galaxy-server
          # 先只做临时签名（命令行程序，curl / scp 拿到的没有隔离标记，不受门禁影响）
          codesign --force --sign - out-server/lemon-galaxy-server
          lipo -info out-server/lemon-galaxy-server
          out-server/lemon-galaxy-server --version
          cp out-server/lemon-galaxy-server out/lemon-galaxy-server
      - name: 服务器装成 launchd 守护进程（安装、启停、改参数、卸载）
        run: scripts/server-service-test.sh out-server
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            out/LemonGalaxy-macOS.dmg
            out/LemonGalaxyWorker-macOS.dmg
            out/lemon-galaxy-server
          if-no-files-found: error

  ios:
    name: iOS 客户端（不签名构建）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: 选用最新的正式版 Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i -E 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: 更新 Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-ios-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-ios-
      - name: 内核 xcframework（含 iOS）
        run: scripts/build-ffi-apple.sh --ios
      - name: 构建与单元测试
        working-directory: lemon-galaxy-mobile-ios
        run: |
          python3 scripts/gen-bridge-mirror.py
          scripts/build.sh --test
          ls -l build/*.ipa

  android:
    name: 安卓客户端
    runs-on: ubuntu-24.04
    env:
      LEMONGALAXY_KEYSTORE_BASE64: ${{ secrets.LEMONGALAXY_KEYSTORE_BASE64 }}
      LEMONGALAXY_KEYSTORE_PASSWORD: ${{ secrets.LEMONGALAXY_KEYSTORE_PASSWORD }}
      LEMONGALAXY_KEY_ALIAS: ${{ secrets.LEMONGALAXY_KEY_ALIAS }}
      LEMONGALAXY_KEY_PASSWORD: ${{ secrets.LEMONGALAXY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: 准备工具链
        run: |
          echo "JAVA_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > lemon-galaxy-mobile-android/local.properties
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
            target
          key: android-${{ hashFiles('Cargo.lock', 'lemon-galaxy-mobile-android/**/*.gradle.kts', 'lemon-galaxy-mobile-android/gradle/libs.versions.toml') }}
          restore-keys: android-
      - name: 构建与测试
        working-directory: lemon-galaxy-mobile-android
        run: |
          BASE="$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -1)"
          if [ -n "$LEMONGALAXY_BUILD_VERSION" ]; then V="${LEMONGALAXY_BUILD_VERSION#v}"; else V="$BASE.$GITHUB_RUN_NUMBER"; fi
          export LEMONGALAXY_VERSION_NAME="$V" LEMONGALAXY_VERSION_CODE="$GITHUB_RUN_NUMBER"
          # Robolectric 首次要从 Maven 下载系统镜像，偶尔网络失败：失败时重试一次
          ./gradlew --no-daemon :app:testDebugUnitTest || { echo "单元测试失败，重试一次"; ./gradlew --no-daemon :app:testDebugUnitTest; }
          ./gradlew --no-daemon :app:assembleRelease
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          unzip -l "$APK" | grep libgalaxy_ffi.so
          mkdir -p ../out && cp "$APK" ../out/LemonGalaxy-Android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/LemonGalaxy-Android.apk
          if-no-files-found: error

  release:
    name: 发布
    # Windows 被控端还在打磨：它失败时照常发布，只是不带 Windows 文件
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.rust-tests.result == 'success' && needs.linux.result == 'success' && needs.linux-gui.result == 'success' && needs.macos.result == 'success' && needs.android.result == 'success'
    needs: [rust-tests, linux, linux-gui, windows, windows7, windows-control, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: art
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_NOTARIZED: ${{ secrets.MACOS_SIGN_IDENTITY != '' && secrets.APPLE_NOTARY_KEY_P8 != '' }}
          RELEASE_SIGNING_KEY: ${{ secrets.LEMONGALAXY_RELEASE_SIGNING_KEY }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; V="${TAG#v}"; else V="$VERSION.$GITHUB_RUN_NUMBER"; TAG="v$V"; fi
          mkdir -p out
          cp art/macos/LemonGalaxy-macOS.dmg "out/LemonGalaxy-$V-macOS.dmg"
          [ -f art/macos/LemonGalaxyWorker-macOS.dmg ] && cp art/macos/LemonGalaxyWorker-macOS.dmg "out/LemonGalaxyWorker-$V-macOS.dmg"
          cp art/android/LemonGalaxy-Android.apk "out/LemonGalaxy-$V-Android.apk"
          for a in x86_64 aarch64; do
            cp "art/linux-$a/lemon-galaxy-worker" "out/lemon-galaxy-worker-$V-linux-$a"
            chmod +x "out/lemon-galaxy-worker-$V-linux-$a"
            cp "art/linux-$a/lemon-galaxy-worker-musl" "out/lemon-galaxy-worker-$V-linux-musl-$a"
            chmod +x "out/lemon-galaxy-worker-$V-linux-musl-$a"
            cp art/linux-pkg-$a/*.deb art/linux-pkg-$a/*.rpm out/
            # 构建产物传过来会丢可执行权限，打包前补上
            chmod +x "art/linux-$a/lemon-galaxy-server"
            tar -C "art/linux-$a" -czf "out/lemon-galaxy-server-$V-linux-$a.tar.gz" lemon-galaxy-server
          done
          if [ -f art/macos/lemon-galaxy-server ]; then
            chmod +x art/macos/lemon-galaxy-server
            tar -C art/macos -czf "out/lemon-galaxy-server-$V-macos-universal.tar.gz" lemon-galaxy-server
          fi
          if [ -f art/windows-control/LemonGalaxy-Windows-x64.zip ]; then
            cp art/windows-control/LemonGalaxy-Windows-x64.zip "out/LemonGalaxy-$V-windows-x64.zip"
          fi
          # 老系统兼容版被控端：Win7 x64、Vista / 7 32 位、XP 32 位（自动更新按平台名 windows7 / windowsxp 与架构区分）
          for f in windows7-x86_64 windows7-x86 windowsxp-x86; do
            if [ -f "art/$f/lemon-galaxy-worker.exe" ]; then
              cp "art/$f/lemon-galaxy-worker.exe" "out/lemon-galaxy-worker-$V-$f.exe"
            fi
          done
          # Windows 主控端兼容版：同一个界面程序，换上 Win7 目标编的内核库与被控端
          # 主控端压缩包由 PowerShell 打包，路径里是反斜杠（unzip 会报错），用 Python 逐个条目改写
          if [ -f art/windows-control/LemonGalaxy-Windows-x64.zip ] && [ -f art/windows7-x86_64/galaxy_ffi.dll ]; then
            python3 - "$V" <<'PY'
          import sys, zipfile
          v = sys.argv[1]
          top = f"LemonGalaxy-{v}-windows7-x64"
          swap = {"galaxy_ffi.dll": "art/windows7-x86_64/galaxy_ffi.dll", "lemon-galaxy-worker.exe": "art/windows7-x86_64/lemon-galaxy-worker.exe"}
          with zipfile.ZipFile("art/windows-control/LemonGalaxy-Windows-x64.zip") as src, \
               zipfile.ZipFile(f"out/LemonGalaxy-{v}-windows7-x64.zip", "w", zipfile.ZIP_DEFLATED) as dst:
              for info in src.infolist():
                  parts = info.filename.replace("\\", "/").split("/")
                  if len(parts) < 2 or info.filename.endswith(("/", "\\")):
                      continue
                  rel = "/".join(parts[1:])
                  data = open(swap[rel], "rb").read() if rel in swap else src.read(info)
                  dst.writestr(f"{top}/{rel}", data)
          print("已生成兼容版主控端压缩包")
          PY
          fi
          WINS=()
          for a in x86_64 aarch64; do
            if [ -f "art/windows-$a/lemon-galaxy-worker.exe" ]; then
              cp "art/windows-$a/lemon-galaxy-worker.exe" "out/lemon-galaxy-worker-$V-windows-$a.exe"
              WINS+=("$a")
            fi
            if [ -f "art/windows-$a/lemon-galaxy-server.exe" ]; then
              (cd "art/windows-$a" && zip -q "../../out/lemon-galaxy-server-$V-windows-$a.zip" lemon-galaxy-server.exe)
            fi
          done
          (cd out && sha256sum * > SHA256SUMS.txt)
          SIGNED=false
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            chmod +x art/linux-x86_64/galaxy-dev
            GD="$PWD/art/linux-x86_64/galaxy-dev --data $RUNNER_TEMP/galaxy-dev"
            (cd out && LEMONGALAXY_RELEASE_SIGNING_KEY="$RELEASE_SIGNING_KEY" $GD release-sign SHA256SUMS.txt && $GD release-verify SHA256SUMS.txt)
            SIGNED=true
          fi
          DL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          PREV="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          {
            echo "## 下载"
            echo
            echo "| 用途 | 系统 | 文件 |"
            echo "|---|---|---|"
            echo "| Mac 客户端（主控 + 被控） | macOS 13 及以上（Apple 芯片、Intel 通用） | [LemonGalaxy-$V-macOS.dmg]($DL/LemonGalaxy-$V-macOS.dmg) |"
            [ -f "out/LemonGalaxyWorker-$V-macOS.dmg" ] && echo "| Mac 被控端（纯被控，可登录多个账号） | macOS 13 及以上（Apple 芯片、Intel 通用） | [LemonGalaxyWorker-$V-macOS.dmg]($DL/LemonGalaxyWorker-$V-macOS.dmg) |"
            [ -f "out/LemonGalaxy-$V-windows-x64.zip" ] && echo "| Windows 客户端（主控） | Windows 10 / 11，x64（ARM64 电脑可用） | [LemonGalaxy-$V-windows-x64.zip]($DL/LemonGalaxy-$V-windows-x64.zip) |"
            [ -f "out/LemonGalaxy-$V-windows7-x64.zip" ] && echo "| Windows 客户端（主控，兼容版） | Windows 7 SP1 / 8 / 8.1，x64（需要 .NET Framework 4.8） | [LemonGalaxy-$V-windows7-x64.zip]($DL/LemonGalaxy-$V-windows7-x64.zip) |"
            echo "| 安卓客户端（主控） | Android 8.0 及以上 | [LemonGalaxy-$V-Android.apk]($DL/LemonGalaxy-$V-Android.apk) |"
            echo "| Linux 被控端（桌面版：窗口 + 托盘 + 远程桌面） | Ubuntu 20.04 / Debian 10 起，x86_64 | [lemon-galaxy-worker_${V}_amd64.deb]($DL/lemon-galaxy-worker_${V}_amd64.deb) |"
            echo "| Linux 被控端（桌面版） | Ubuntu 20.04 / Debian 10 起，ARM64 | [lemon-galaxy-worker_${V}_arm64.deb]($DL/lemon-galaxy-worker_${V}_arm64.deb) |"
            echo "| Linux 被控端（桌面版） | CentOS / RHEL / Rocky / Alma 8 起、Fedora、openSUSE，x86_64 | [lemon-galaxy-worker-$V.x86_64.rpm]($DL/lemon-galaxy-worker-$V.x86_64.rpm) |"
            echo "| Linux 被控端（桌面版） | 同上，ARM64 | [lemon-galaxy-worker-$V.aarch64.rpm]($DL/lemon-galaxy-worker-$V.aarch64.rpm) |"
            echo "| Linux 被控端（单文件，服务器用，含远程桌面与虚拟桌面） | glibc 2.17 起（CentOS 7 起），x86_64 | [lemon-galaxy-worker-$V-linux-x86_64]($DL/lemon-galaxy-worker-$V-linux-x86_64) |"
            echo "| Linux 被控端（单文件） | glibc 2.17 起，ARM64 | [lemon-galaxy-worker-$V-linux-aarch64]($DL/lemon-galaxy-worker-$V-linux-aarch64) |"
            echo "| Linux 被控端（精简版，只有终端与文件） | 任意发行版（含 Alpine），x86_64 | [lemon-galaxy-worker-$V-linux-musl-x86_64]($DL/lemon-galaxy-worker-$V-linux-musl-x86_64) |"
            echo "| Linux 被控端（精简版） | 任意发行版，ARM64 | [lemon-galaxy-worker-$V-linux-musl-aarch64]($DL/lemon-galaxy-worker-$V-linux-musl-aarch64) |"
            for a in "${WINS[@]}"; do
              case $a in x86_64) W="x64" ;; *) W="ARM64" ;; esac
              echo "| Windows 被控端 | Windows 10 / Server 2016 及以上，$W | [lemon-galaxy-worker-$V-windows-$a.exe]($DL/lemon-galaxy-worker-$V-windows-$a.exe) |"
            done
            [ -f "out/lemon-galaxy-worker-$V-windows7-x86_64.exe" ] && echo "| Windows 被控端（兼容版） | Windows 7 SP1 / 8 / 8.1 / Server 2008 R2–2012 R2，x64 | [lemon-galaxy-worker-$V-windows7-x86_64.exe]($DL/lemon-galaxy-worker-$V-windows7-x86_64.exe) |"
            [ -f "out/lemon-galaxy-worker-$V-windows7-x86.exe" ] && echo "| Windows 被控端（32 位兼容版） | Windows Vista SP2 / 7 / 8 / 8.1 / 10 32 位，Server 2008 | [lemon-galaxy-worker-$V-windows7-x86.exe]($DL/lemon-galaxy-worker-$V-windows7-x86.exe) |"
            [ -f "out/lemon-galaxy-worker-$V-windowsxp-x86.exe" ] && echo "| Windows 被控端（XP 兼容版，实验） | Windows XP SP3 / Server 2003 SP2 32 位（只做被控，没有声音、隐私屏、虚拟屏） | [lemon-galaxy-worker-$V-windowsxp-x86.exe]($DL/lemon-galaxy-worker-$V-windowsxp-x86.exe) |"
            for a in "${WINS[@]}"; do
              case $a in x86_64) W="x64" ;; *) W="ARM64" ;; esac
              [ -f "out/lemon-galaxy-server-$V-windows-$a.zip" ] && echo "| 服务器（内嵌管理后台） | Windows 10 / 11 / Server 2016 及以上，$W | [lemon-galaxy-server-$V-windows-$a.zip]($DL/lemon-galaxy-server-$V-windows-$a.zip) |"
            done
            echo "| 服务器（内嵌管理后台） | Linux x86_64 | [lemon-galaxy-server-$V-linux-x86_64.tar.gz]($DL/lemon-galaxy-server-$V-linux-x86_64.tar.gz) |"
            echo "| 服务器（内嵌管理后台） | Linux ARM64 | [lemon-galaxy-server-$V-linux-aarch64.tar.gz]($DL/lemon-galaxy-server-$V-linux-aarch64.tar.gz) |"
            [ -f "out/lemon-galaxy-server-$V-macos-universal.tar.gz" ] && echo "| 服务器（内嵌管理后台） | macOS 13 及以上，Apple 芯片 / Intel 通用 | [lemon-galaxy-server-$V-macos-universal.tar.gz]($DL/lemon-galaxy-server-$V-macos-universal.tar.gz) |"
            echo
            if [ "$SIGNED" = true ]; then
              echo "校验：[SHA256SUMS.txt]($DL/SHA256SUMS.txt)，发布签名 [SHA256SUMS.txt.sig]($DL/SHA256SUMS.txt.sig)（客户端自动更新只装签名有效的版本）"
            else
              echo "校验：[SHA256SUMS.txt]($DL/SHA256SUMS.txt)（这一版没有发布签名，客户端不会自动安装）"
            fi
            echo
            echo "### 快速开始"
            echo
            echo '1. 服务器（Linux）：解压后运行 `sudo ./lemon-galaxy-server install-service --public-host <你的域名或公网 IP>` 装成开机自启的服务，会打印初始化网址和「客户端填写的服务器地址」；也可以直接 `./lemon-galaxy-server --public-host <...>` 前台运行。放行 TCP 与 UDP 7443 端口。'
            echo '   服务器（Windows）：解压后以管理员身份打开 PowerShell，运行 `.\lemon-galaxy-server.exe install-service --public-host <你的域名或公网 IP>`，会装成系统服务并在 Windows 防火墙放行端口。'
            echo '   服务器（macOS）：解压后运行 `sudo ./lemon-galaxy-server install-service --public-host <你的域名或 IP>`，装成开机自启的 launchd 守护进程。用浏览器下载的先运行 `xattr -d com.apple.quarantine lemon-galaxy-server` 去掉隔离标记（程序暂未公证）。'
