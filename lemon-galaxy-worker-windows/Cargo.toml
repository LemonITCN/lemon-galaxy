[package]
name = "lemon-galaxy-worker-windows"
description = "LemonGalaxy Windows 被控端：系统服务 + 用户会话里的画面代理（截屏、编码、键鼠、剪贴板）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lemon-galaxy-worker"
path = "src/main.rs"

[dependencies]
galaxy-proto.workspace = true
galaxy-host.workspace = true
galaxy-worker.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[target.'cfg(windows)'.dependencies]
postcard.workspace = true
windows-service = "0.8"
openh264 = "0.9"
jpeg-encoder = "0.7"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Com",
  "Win32_System_Com_Marshal",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
] }

[lints.rust]
# Windows XP 兼容版构建时加 --cfg lemon_galaxy_xp（见 scripts/build-windows-legacy.sh）
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lemon_galaxy_xp)'] }
