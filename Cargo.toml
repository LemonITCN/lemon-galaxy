[workspace]
resolver = "2"
members = [
    "lemon-galaxy-common-rust/galaxy-proto",
    "lemon-galaxy-common-rust/galaxy-crypto",
    "lemon-galaxy-common-rust/galaxy-net",
    "lemon-galaxy-common-rust/galaxy-client",
    "lemon-galaxy-common-rust/galaxy-host",
    "lemon-galaxy-common-rust/galaxy-agent",
    "lemon-galaxy-common-rust/galaxy-ffi",
    "lemon-galaxy-common-rust/galaxy-dev",
    "lemon-galaxy-server",
    "lemon-galaxy-worker-linux",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
galaxy-proto = { path = "lemon-galaxy-common-rust/galaxy-proto" }
galaxy-crypto = { path = "lemon-galaxy-common-rust/galaxy-crypto" }
galaxy-net = { path = "lemon-galaxy-common-rust/galaxy-net" }
galaxy-client = { path = "lemon-galaxy-common-rust/galaxy-client" }
galaxy-host = { path = "lemon-galaxy-common-rust/galaxy-host" }
galaxy-agent = { path = "lemon-galaxy-common-rust/galaxy-agent" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
base64 = "0.22"
hex = "0.4"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }

# 密码学（RustCrypto 上一代稳定版，彼此 trait 兼容，opaque-ke 4 也基于这一代）
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde", "pkcs8"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
opaque-ke = { version = "4.0.1", features = ["argon2", "std"] }
spake2 = "0.4"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# 网络
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream", "http2"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# 过程宏与构建脚本不剥符号：新版 Xcode 的 strip 会把 macOS 上的过程宏动态库剥坏
[profile.release.build-override]
opt-level = 2
strip = false
debug = false

[profile.dev.package."*"]
opt-level = 2
